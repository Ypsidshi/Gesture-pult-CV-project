[project]
name = "gesture-pult"
version = "1.0.0"
description = "Управление компьютером жестами перед веб-камерой: MediaPipe Hand Landmarker, OpenCV, PyAutoGUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ypsidshi", email = "Ypsidshi@users.noreply.github.com" }]
keywords = [
    "computer-vision",
    "gesture-recognition",
    "mediapipe",
    "opencv",
    "pyautogui",
    "hand-tracking",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# Шаги лабораторной намеренно начинаются с `from common import *`:
# так каждый шаг остаётся коротким и самодостаточным.
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
# sys.path правится до импорта common, поэтому импорты не в начале файла.
"tests/test_logic.py" = ["E402"]
